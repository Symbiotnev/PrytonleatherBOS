<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Brand colour: matches the blue used in the app -->
    <meta name="theme-color" content="#1E6BA8" />

    <!-- Icons (all files live in /public) -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Primary SEO -->
    <title>Pryton Leather BOS</title>
    <meta
      name="description"
      content="Pryton Leather BOS – Business Operating Software for managing your leather business: orders, inventory, and operations in one place."
    />
    <meta name="application-name" content="Pryton Leather BOS" />
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, Telegram, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pryton Leather BOS" />
    <meta property="og:title" content="Pryton Leather BOS" />
    <meta
      property="og:description"
      content="Business Operating Software for Pryton Leather – orders, inventory, and operations in one place."
    />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pryton Leather logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pryton Leather BOS" />
    <meta
      name="twitter:description"
      content="Business Operating Software for Pryton Leather – orders, inventory, and operations in one place."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta name="twitter:image:alt" content="Pryton Leather logo" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
